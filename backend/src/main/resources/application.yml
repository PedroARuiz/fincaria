spring:
  application:
    # Tags metrics and structured logs with the service name (ECS `service.name`).
    name: fincaria
  web:
    locale: en
    locale-resolver: fixed
  datasource:
    url: jdbc:postgresql://localhost:5432/fincaria_local_db
    username: fincaria_local_user
    password: fincaria_local_pwd
  jpa:
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    # Back Spring Cache with Redis; TTL and value serialization are configured
    # in CacheConfig.
    type: redis
    # Pre-create the cache at startup so its hit/miss metrics are bound to the
    # registry immediately (RedisCacheManager otherwise creates caches lazily).
    cache-names:
      - cropTypeCatalog

management:
  endpoints:
    web:
      exposure:
        # Expose only what we need over HTTP: health plus the Prometheus
        # scrape endpoint (/actuator/prometheus).
        include: health,prometheus
  tracing:
    sampling:
      # Trace every request so trace/span IDs always show up while developing.
      # A real production deployment would lower this to sample a fraction.
      probability: 1.0
  metrics:
    distribution:
      percentiles-histogram:
        # Publish Prometheus histogram buckets for the HTTP server timer so
        # latency percentiles (p95/p99) can be computed server-side in
        # Prometheus/Grafana via histogram_quantile() over the `_bucket` series.
        # Without this, only count/sum/max are exported (mean at best).
        http.server.requests: true

fincaria:
  jwt:
    # Dev-only fallback so local runs/tests work with zero setup. Any real
    # environment MUST override this via the JWT_SECRET env var — never
    # commit a real secret here.
    secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-before-any-real-deploy}
    expiration-seconds: 3600
  cadastral:
    # Fraction (0.0-1.0) of simulated cadastral registry calls that fail, to
    # exercise the retry + circuit breaker. 0.0 keeps lookups healthy; raise it
    # (e.g. 1.0 via CADASTRAL_FAILURE_RATE) to watch the circuit open in
    # logs/metrics.
    failure-rate: ${CADASTRAL_FAILURE_RATE:0.0}
