spring:
  application:
    # Tags metrics and structured logs with the service name (ECS `service.name`).
    name: fincaria
  web:
    locale: en
    locale-resolver: fixed
  datasource:
    url: jdbc:postgresql://localhost:5432/fincaria_local_db
    username: fincaria_local_user
    password: fincaria_local_pwd
  jpa:
    hibernate:
      ddl-auto: validate

management:
  tracing:
    sampling:
      # Trace every request so trace/span IDs always show up while developing.
      # A real production deployment would lower this to sample a fraction.
      probability: 1.0

fincaria:
  jwt:
    # Dev-only fallback so local runs/tests work with zero setup. Any real
    # environment MUST override this via the JWT_SECRET env var — never
    # commit a real secret here.
    secret: ${JWT_SECRET:dev-only-insecure-jwt-secret-change-me-before-any-real-deploy}
    expiration-seconds: 3600
