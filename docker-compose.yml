services:
  db:
    # Plain postgres for now (no migration uses PostGIS geometry yet) — it ships
    # a native arm64 image, unlike postgis/postgis, avoiding slow amd64
    # emulation on Apple Silicon. Switch back to postgis/postgis once a
    # migration actually needs geometry types.
    image: postgres:18
    environment:
      POSTGRES_USER: fincaria_local_user
      POSTGRES_PASSWORD: fincaria_local_pwd
      POSTGRES_DB: fincaria_local_db
    ports:
      - "5432:5432"
    volumes:
      - fincaria-db-data:/var/lib/postgresql

  redis:
    # In-memory cache for the crop type catalog (Spring Cache). Ephemeral by
    # design — no volume — since everything here can be rebuilt from Postgres.
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kafka:
    # Event broker for the outbox relay + domain-event consumers (Milestone 8).
    # Kafka 4.x is KRaft-only (ZooKeeper was removed in 4.0), so this single
    # container runs as both broker and controller — no separate coordinator.
    # Ephemeral by design — no volume — since Postgres' outbox table is the
    # source of truth for events, so the log can always be rebuilt from it.
    image: apache/kafka:4.4.0
    ports:
      # Only the broker (client) listener is published to the host; the app
      # runs on the host and connects to localhost:9092, like db and redis.
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Bind the broker listener on 9092 and the internal KRaft controller
      # listener on 9093 (the latter is never published to the host).
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      # What the broker tells clients to reconnect on. The app lives on the
      # host, so it must advertise localhost:9092 — the classic Kafka gotcha.
      # The controller listener is deliberately not advertised (KRaft rule).
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # Single-node cluster: every internal topic replicates to just one broker.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Form consumer groups immediately in local dev instead of waiting.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly (via migration/CLI), never on first use,
      # so a typo in a topic name fails loudly instead of silently creating one.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  prometheus:
    image: prom/prometheus:v3.1.0
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - fincaria-prometheus-data:/prometheus
    # Maps `host.docker.internal` to the host gateway so the scrape config can
    # reach the app running on the host; needed on Linux, harmless elsewhere.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3000:3000"
    environment:
      # Local-dev convenience only: open Grafana with no login as admin. Never
      # use anonymous admin access in a real deployment.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - fincaria-grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  fincaria-db-data:
  fincaria-prometheus-data:
  fincaria-grafana-data: